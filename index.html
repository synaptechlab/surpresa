<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Uma surpresa para você ❤️</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <div class="content">

            <p class="eyebrow">UMA SURPRESA ESTÁ SENDO REVELADA</p>

            <h1>Você vai precisar esperar...</h1>

            <p class="description">
                A cada semana, um pouco mais da surpresa será revelado.
            </p>

            <div class="image-container">
                <img
                    id="surprise-image"
                    src="https://picsum.photos/800/800"
                    alt="Sua surpresa"
                    draggable="false"
                >

                <div id="image-overlay"></div>
            </div>

            <div class="week-info">

                <span id="week-label">SEMANA 1 DE 12</span>

                <div class="progress-container">
                    <div id="progress-bar"></div>
                </div>

                <p id="countdown">
                    Calculando...
                </p>

            </div>

            <p class="message">
                Algumas coisas ficam melhores quando esperamos por elas. ❤️
            </p>

        </div>

    </main>

    <script src="script.js"></script>

</body>
</html>
